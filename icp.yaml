networks:
  - name: local
    mode: managed
    gateway:
      port: 8765

environments:
  - name: local
    network: local
    # art-lab is a local-only preview canister behind the /art-lab page.
    canisters: [icrc7, backend, frontend, art-lab]
    settings:
      backend:
        environment_variables:
          MOCK_PAYMENTS: "1"
  - name: ic
    network: ic
    canisters: [icrc7, backend, frontend]
    settings:
      backend:
        environment_variables:
          MOCK_PAYMENTS: "0"
        freezing_threshold: 2592000  # 30 days (small budget; raise once topped up)
      icrc7:
        freezing_threshold: 2592000

canisters:
  - backend/src/icrc7
  - backend
  - backend/tools
  - frontend
