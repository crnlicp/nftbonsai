networks:
  - name: local
    mode: managed
    gateway:
      port: 8765

environments:
  - name: local
    network: local
    # art_lab is a local-only preview canister behind the /art-lab page.
    canisters: [icrc7, market, app, art_lab]
    settings:
      market:
        environment_variables:
          MOCK_PAYMENTS: "1"
  - name: ic
    network: ic
    canisters: [icrc7, market, app]
    settings:
      market:
        environment_variables:
          MOCK_PAYMENTS: "0"
        freezing_threshold: 2592000  # 30 days (small budget; raise once topped up)
      icrc7:
        freezing_threshold: 2592000

canisters:
  - canisters/*/*
